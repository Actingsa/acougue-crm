<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Sem conexão · Carne.CRM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #09090b; color: #fafafa; font-family: Inter, system-ui, -apple-system, sans-serif; }
      .wrap { min-height: 100%; display: grid; place-items: center; padding: 1.5rem; }
      .card { max-width: 28rem; text-align: center; }
      .tag { font: 700 10px/1 "JetBrains Mono", monospace; letter-spacing: .3em; text-transform: uppercase; color: #ef4444; }
      h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 0.75rem 0 0.5rem; font-weight: 900; }
      p { color: #a1a1aa; margin: 0 0 1.5rem; font-size: 0.95rem; line-height: 1.5; }
      button { background: #ef4444; color: #fff; border: 0; padding: 0.85rem 1.5rem; font: 700 11px/1 "JetBrains Mono", monospace; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
      button:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="tag">Modo offline</div>
        <h1>Sem conexão no momento</h1>
        <p>Você está sem internet. Os dados já carregados continuam disponíveis. Reconecte para sincronizar.</p>
        <button onclick="location.reload()">Tentar novamente</button>
      </div>
    </div>
  </body>
</html>
